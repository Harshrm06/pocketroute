# Docker Compose Configuration for PocketRoute Pune Transit Optimizer
# PRD Section 12.1, 13, 17.5

services:
  # ----------------------------------------------------------------------------
  # Backend API Service (Fastify + Engine)
  # ----------------------------------------------------------------------------
  api:
    container_name: pocketroute-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NODE_ENV=production
      - CORS_ORIGIN=*
      - RATE_LIMIT_PER_MIN=60
      - LOG_LEVEL=info
      - DATA_VERSION=2026.10.1
      - NOMINATIM_URL=https://nominatim.openstreetmap.org
      # Set OSRM_BASE_URL=http://osrm:5000 when running with optional OSRM container
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/api/v1/health']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Frontend Web Service (Nginx + React SPA + Reverse Proxy)
  # ----------------------------------------------------------------------------
  web:
    container_name: pocketroute-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_API_BASE_URL=/api/v1
        - VITE_MAP_STYLE_URL=https://tiles.openfreemap.org/styles/bright
    ports:
      - '80:80'
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Optional OSRM Service (Road Routing Engine for auto & cab geometry)
  #
  # Instructions to enable:
  # 1. Download Maharashtra/Pune OSM extract:
  #    curl -O https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
  # 2. Extract and pre-process graph with car profile:
  #    docker run -t -v "${PWD}/osrm-data:/data" ghcr.io/project-osrm/osrm-backend \
  #      osrm-extract -p /opt/car.lua /data/western-zone-latest.osm.pbf
  #    docker run -t -v "${PWD}/osrm-data:/data" ghcr.io/project-osrm/osrm-backend \
  #      osrm-partition /data/western-zone-latest.osrm
  #    docker run -t -v "${PWD}/osrm-data:/data" ghcr.io/project-osrm/osrm-backend \
  #      osrm-customize /data/western-zone-latest.osrm
  # 3. Uncomment the block below and configure OSRM_BASE_URL=http://osrm:5000 in the api service.
  # ============================================================================
  # osrm:
  #   image: ghcr.io/project-osrm/osrm-backend:latest
  #   container_name: pocketroute-osrm
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./osrm-data:/data:ro
  #   command: osrm-routed --algorithm mld /data/western-zone-latest.osrm
